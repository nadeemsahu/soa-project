server:
  port: 0

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:h2:mem:billingtestdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

apexcare:
  kafka:
    consumer:
      enabled: false

eureka:
  client:
    enabled: false
