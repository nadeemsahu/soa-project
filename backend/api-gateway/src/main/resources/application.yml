server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: patient-service-route
          uri: lb://PATIENT-SERVICE
          predicates:
            - Path=/api/patients/**, /api/doctors/**, /ws/**

        - id: appointment-service-route
          uri: lb://APPOINTMENT-SERVICE
          predicates:
            - Path=/api/appointments/**

        - id: billing-service-route
          uri: lb://BILLING-SERVICE
          predicates:
            - Path=/api/billing/**

        - id: auth-docs-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - SetPath=/v3/api-docs

        - id: patient-docs-route
          uri: lb://PATIENT-SERVICE
          predicates:
            - Path=/v3/api-docs/patients
          filters:
            - SetPath=/v3/api-docs

        - id: appointment-docs-route
          uri: lb://APPOINTMENT-SERVICE
          predicates:
            - Path=/v3/api-docs/appointments
          filters:
            - SetPath=/v3/api-docs

        - id: billing-docs-route
          uri: lb://BILLING-SERVICE
          predicates:
            - Path=/v3/api-docs/billing
          filters:
            - SetPath=/v3/api-docs

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods, RETAIN_UNIQUE

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Auth Service
        url: /v3/api-docs/auth
      - name: 2. Patient Service
        url: /v3/api-docs/patients
      - name: 3. Appointment Service
        url: /v3/api-docs/appointments
      - name: 4. Billing Service
        url: /v3/api-docs/billing

apexcare:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

eureka:
  instance:
    prefer-ip-address: true
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:8761/eureka/

