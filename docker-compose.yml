version: '3.8'

services:
  # Service Discovery Registry
  eureka-server:
    build:
      context: ./backend
      dockerfile: ./eureka-server/Dockerfile
    container_name: apexcare-eureka
    ports:
      - "8761:8761"
    networks:
      - apexcare-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Kafka Message Broker & Zookeeper (Choreography)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: apexcare-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - apexcare-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: apexcare-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - apexcare-network

  # Core Microservices
  auth-service:
    build:
      context: ./backend
      dockerfile: ./auth-service/Dockerfile
    container_name: apexcare-auth
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - apexcare-network

  patient-service:
    build:
      context: ./backend
      dockerfile: ./patient-service/Dockerfile
    container_name: apexcare-patient
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - apexcare-network

  appointment-service:
    build:
      context: ./backend
      dockerfile: ./appointment-service/Dockerfile
    container_name: apexcare-appointment
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server
      - kafka
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - apexcare-network

  billing-service:
    build:
      context: ./backend
      dockerfile: ./billing-service/Dockerfile
    container_name: apexcare-billing
    ports:
      - "8084:8084"
    depends_on:
      - eureka-server
      - kafka
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - apexcare-network

  # API Gateway (Edge Routing & Load Balancing)
  api-gateway:
    build:
      context: ./backend
      dockerfile: ./api-gateway/Dockerfile
    container_name: apexcare-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - auth-service
      - patient-service
      - appointment-service
      - billing-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - apexcare-network

  # Frontend Web Application (React Stitch Design)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apexcare-ui
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - apexcare-network

networks:
  apexcare-network:
    driver: bridge
